<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#F7F9FC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cirvela">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=42">
  <title>Cirvela</title>

  <script>
  (function(){
    const build='V42';
    window.__CIRVELA_BUILD__=build;
    try{
      if('serviceWorker' in navigator){
        navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).then(()=>{
          if(navigator.serviceWorker.controller && sessionStorage.getItem('fc-build-reload')!==build){
            sessionStorage.setItem('fc-build-reload',build);
            location.reload();
          }
        });
      }
      if('caches' in window){
        caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k))));
      }
    }catch(e){}
  })();
  </script>

</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brandline">
        <div class="brandblock">
          <div class="cirvela-wordmark" aria-label="Cirvela"><span class="cirvela-black">Cir</span><span class="cirvela-v">v</span><span class="cirvela-red">ela</span></div>
          <div class="subtitle">Private Demo <span class="build-badge">V42</span></div>
        </div>
        <div class="header-tools">
          <button id="hubTop" class="hub-launch" aria-label="Circle Hub öffnen"><b>Circle Hub</b><em id="hubAlert">0</em></button>
          <button id="settingsTop" class="settings-top" aria-label="Einstellungen">
            <svg viewBox="0 0 64 64" role="img" aria-hidden="true"><path d="M27 5h10l2 8a21 21 0 0 1 5 3l8-2 5 9-6 6a21 21 0 0 1 0 6l6 6-5 9-8-2a21 21 0 0 1-5 3l-2 8H27l-2-8a21 21 0 0 1-5-3l-8 2-5-9 6-6a21 21 0 0 1 0-6l-6-6 5-9 8 2a21 21 0 0 1 5-3z" fill="#8A8F98"/><circle cx="32" cy="32" r="10" fill="white" stroke="#666B73" stroke-width="3"/></svg>
          </button>
        </div>
      </div>
      <div id="circleCarousel" class="circle-carousel" aria-label="Circles auswählen"></div>
      <button id="circleSwitchBtn" class="circle-switch legacy-circle-switch" aria-label="Circle wechseln" hidden>
        <span id="circleNameTop">FamilyCircle</span><span id="circleUnreadTop" class="circle-unread-top" hidden>0</span><span class="circle-chevron">⌄</span>
      </button>
      <h1 id="pageTitle" class="visually-hidden">Chats</h1>
    </header>

    <main id="content"></main>

    <nav id="bottomNav" class="bottom-nav" aria-label="Hauptnavigation">
      <button class="nav-item active" data-tab="chat"><span class="nav-glyph">💬</span><b>Chats</b></button>
      <button class="nav-item" data-tab="calendar"><span class="nav-glyph">📅</span><b>Kalender</b></button>
      <button class="nav-item" data-tab="location"><span class="nav-glyph">📍</span><b>Standort</b></button>
      <button id="sosBtn" class="sos-button" aria-label="SOS auslösen">SOS</button>
      <button class="nav-item" data-tab="games"><span class="nav-glyph controller-glyph" aria-hidden="true"><svg viewBox="0 0 64 44"><path d="M16 7h32c6 0 10 4 12 11l3 12c2 8-6 12-11 6l-7-8H19l-7 8C7 42-1 38 1 30l3-12C6 11 10 7 16 7Z" fill="#111"/><rect x="15" y="16" width="14" height="4" rx="2" fill="#fff"/><rect x="20" y="11" width="4" height="14" rx="2" fill="#fff"/><circle cx="43" cy="15" r="3" fill="#fff"/><circle cx="50" cy="21" r="3" fill="#fff"/></svg></span><b>Spiele</b></button>
      <button class="nav-item" data-tab="status"><span class="nav-glyph status-nav-icon"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="20" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" stroke-dasharray="92 34"/><circle cx="32" cy="32" r="8" fill="#EAF2FF" stroke="#1769E0" stroke-width="3"/></svg></span><b>Status</b></button>
      <button class="nav-item" data-tab="feed"><span class="nav-glyph feed-nav-icon"><svg viewBox="0 0 64 64"><path d="M14 29v25h14V42h8v15h14V42L32 14z" fill="#2F80ED"/><path d="M9 30L32 8l23 22" fill="none" stroke="#E52420" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><b>Feed</b></button>
    </nav>

    <div id="modalRoot"></div>
    <input id="galleryInput" type="file" accept="image/*,video/*" hidden>
    <input id="cameraInput" type="file" accept="image/*,video/*" capture="environment" hidden>
    <input id="scoreInput" type="file" accept="image/*" hidden>
  </div>
  <script src="./app.js?v=42"></script>
</body>
</html>
