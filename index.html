<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FamilyCircle">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css?v=15">
  <title>FamilyCircle</title>

  <script>
  (function(){
    const build='V15';
    window.__FAMILYCIRCLE_BUILD__=build;
    try{
      if('serviceWorker' in navigator){
        navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).then(()=>{
          if(navigator.serviceWorker.controller && sessionStorage.getItem('fc-build-reload')!==build){
            sessionStorage.setItem('fc-build-reload',build);
            location.reload();
          }
        });
      }
      if('caches' in window){
        caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k))));
      }
    }catch(e){}
  })();
  </script>

</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brandblock">
        <button id="circleSwitchBtn" class="circle-switch" aria-label="Circle wechseln">
          <span id="circleNameTop">FamilyCircle</span>
          <span id="circleUnreadTop" class="circle-unread-top" hidden>0</span>
          <span class="circle-chevron">⌄</span>
        </button>
        <h1 id="pageTitle">Chats</h1>
        <div class="subtitle">private Demo <span class="build-badge">V15</span></div>
      </div>
      <div class="top-actions">
        <button id="statusTop" class="top-action" aria-label="Status">
          <span class="top-icon status-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64" role="img">
              <circle cx="32" cy="32" r="20" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" stroke-dasharray="92 34"/>
              <circle cx="32" cy="32" r="8" fill="#EAF2FF" stroke="#1769E0" stroke-width="3"/>
            </svg>
          </span><span>Status</span>
        </button>
        <button id="feedTop" class="top-action" aria-label="Feed">
          <span class="top-icon feed-house" aria-hidden="true">
<svg viewBox="0 0 64 64" role="img">
  <path d="M14 29v25h14V39h8v15h14V29L32 14z" fill="#2F80ED"/>
  <path d="M9 30L32 8l23 22" fill="none" stroke="#E52420" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</span><span>Feed</span>
        </button>
        <button id="settingsTop" class="top-action" aria-label="Einstellungen">
          <span class="top-icon settings-gear" aria-hidden="true">
<svg viewBox="0 0 64 64" role="img">
  <path d="M27 5h10l2 8a21 21 0 0 1 5 3l8-2 5 9-6 6a21 21 0 0 1 0 6l6 6-5 9-8-2a21 21 0 0 1-5 3l-2 8H27l-2-8a21 21 0 0 1-5-3l-8 2-5-9 6-6a21 21 0 0 1 0-6l-6-6 5-9 8 2a21 21 0 0 1 5-3z" fill="#8A8F98"/>
  <circle cx="32" cy="32" r="10" fill="white" stroke="#666B73" stroke-width="3"/>
</svg>
</span><span>Einstellungen</span>
        </button>
      </div>
    </header>

    <main id="content"></main>

    <nav id="bottomNav" class="bottom-nav" aria-label="Hauptnavigation">
      <button class="nav-item active" data-tab="chat"><span>💬</span><b>Chats</b></button>
      <button class="nav-item" data-tab="calendar"><span>📅</span><b>Kalender</b></button>
      <button id="sosBtn" class="sos-button" aria-label="SOS auslösen">SOS</button>
      <button class="nav-item" data-tab="location"><span>📍</span><b>Standort</b></button>
      <button class="nav-item" data-tab="games"><span>🎮</span><b>Spiele</b></button>
    </nav>

    <div id="modalRoot"></div>
    <input id="galleryInput" type="file" accept="image/*,video/*" hidden>
    <input id="cameraInput" type="file" accept="image/*,video/*" capture="environment" hidden>
    <input id="scoreInput" type="file" accept="image/*" hidden>
  </div>
  <script src="app.js?v=15"></script>
</body>
</html>
